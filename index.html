<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<title>課程管理</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111112;
    --bg2: #1c1c1e;
    --bg3: #2c2c2e;
    --border: rgba(255,255,255,0.08);
    --text: #f5f5f5;
    --text2: #8e8e93;
    --text3: #48484a;
    --red: #ff453a;
    --blue: #0a84ff;
    --green: #32d74b;
    --amber: #ffd60a;
    --red-bg: rgba(255,69,58,0.12);
    --blue-bg: rgba(10,132,255,0.12);
    --green-bg: rgba(50,215,75,0.12);
    --amber-bg: rgba(255,214,10,0.12);
    --radius: 14px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 90px;
    -webkit-font-smoothing: antialiased;
  }

  /* TOP BAR */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(17,17,18,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-left h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .topbar-left p { font-size: 12px; color: var(--text2); margin-top: 1px; font-family: 'DM Mono', monospace; }
  .add-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--text); color: var(--bg);
    border: none; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity .15s;
  }
  .add-btn:active { opacity: .7; }

  /* TABS */
  .tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    background: var(--bg);
    position: sticky; top: 65px; z-index: 40;
  }
  .tab {
    flex: 1; padding: 12px 0; font-size: 13px; font-weight: 400;
    color: var(--text2); cursor: pointer; text-align: center;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab.active { color: var(--text); font-weight: 500; border-bottom-color: var(--text); }

  /* SECTIONS */
  .section { display: none; padding: 16px 20px; }
  .section.active { display: block; }

  /* LOADING */
  .loading {
    text-align: center; padding: 48px 0;
    color: var(--text2); font-size: 14px;
  }
  .spinner {
    width: 24px; height: 24px; border: 2px solid var(--bg3);
    border-top-color: var(--text2); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MONTH LABEL */
  .month-label {
    font-size: 11px; font-weight: 500; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin: 20px 0 8px; padding-left: 2px;
  }
  .month-label:first-child { margin-top: 4px; }

  /* COURSE CARD */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
    position: relative; overflow: hidden;
  }
  .card:active { transform: scale(.98); }
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; border-radius: 3px 0 0 3px;
  }
  .card.tag-授課-教官::before { background: var(--red); }
  .card.tag-授課-助教::before { background: #ff8c00; }
  .card.tag-訓練::before { background: var(--blue); }
  .card.tag-其他::before { background: var(--amber); }
  .card.expired { opacity: 0.4; filter: grayscale(40%); }
  .badge-授課-教官 { background: var(--red-bg); color: var(--red); }
  .badge-授課-助教 { background: rgba(255,140,0,0.12); color: #ff8c00; }
  .badge-訓練 { background: var(--blue-bg); color: var(--blue); }
  .badge-其他 { background: var(--amber-bg); color: var(--amber); }

  .card-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; padding-left: 2px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .card-meta span {
    font-size: 12px; color: var(--text2);
    display: flex; align-items: center; gap: 4px;
    font-family: 'DM Mono', monospace;
  }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 9px;
    border-radius: 20px; font-weight: 500; margin-top: 8px;
  }
  .badge-授課 { background: var(--red-bg); color: var(--red); }
  .badge-複訓 { background: var(--blue-bg); color: var(--blue); }
  .badge-受訓 { background: var(--green-bg); color: var(--green); }
  .badge-行政 { background: var(--amber-bg); color: var(--amber); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .stat-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; font-family: 'DM Mono', monospace; letter-spacing: .04em; }
  .stat-val { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
  .stat-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

  .chart-label {
    font-size: 11px; color: var(--text3); letter-spacing: .06em;
    text-transform: uppercase; font-family: 'DM Mono', monospace;
    margin: 20px 0 10px;
  }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-name { font-size: 12px; color: var(--text2); width: 52px; flex-shrink: 0; font-family: 'DM Mono', monospace; }
  .bar-track { flex: 1; height: 22px; background: var(--bg3); border-radius: 6px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 6px;
    display: flex; align-items: center; padding-left: 8px;
    min-width: 32px; transition: width .4s ease;
  }
  .bar-fill span { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.9); font-family: 'DM Mono', monospace; }

  /* EMPTY */
  .empty { text-align: center; padding: 60px 0; color: var(--text2); font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: .4; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(28,28,30,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; padding: 8px 0 20px;
    z-index: 100;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 3px; cursor: pointer;
    color: var(--text3); font-size: 10px; transition: color .15s;
    padding: 4px 0;
  }
  .nav-item.active { color: var(--text); }
  .nav-icon { font-size: 22px; }

  /* MODAL */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 200; display: none; align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--bg2); border-radius: 20px 20px 0 0;
    padding: 0 20px 40px; width: 100%; max-height: 92vh;
    overflow-y: auto; animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle {
    width: 36px; height: 4px; background: var(--bg3);
    border-radius: 2px; margin: 12px auto 16px;
  }
  .sheet-title { font-size: 17px; font-weight: 600; margin-bottom: 20px; }

  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; display: block; letter-spacing: .04em; font-family: 'DM Mono', monospace; }
  select, input[type=text], input[type=date], input[type=time], input[type=number], textarea {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm);
    padding: 11px 13px; font-size: 14px; font-family: 'Noto Sans TC', sans-serif;
    appearance: none; -webkit-appearance: none;
    outline: none; transition: border-color .15s;
  }
  select:focus, input:focus, textarea:focus { border-color: rgba(255,255,255,0.25); }
  textarea { height: 80px; resize: none; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-row { display: flex; gap: 10px; margin-top: 6px; }
  .btn {
    flex: 1; padding: 13px; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500; cursor: pointer;
    border: none; font-family: 'Noto Sans TC', sans-serif;
    transition: opacity .15s;
  }
  .btn:active { opacity: .7; }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-danger { background: var(--red-bg); color: var(--red); }
  .btn-ghost { background: var(--bg3); color: var(--text2); }

  /* DETAIL SHEET */
  .detail-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-start; }
  .detail-icon { font-size: 16px; margin-top: 1px; flex-shrink: 0; }
  .detail-text { font-size: 14px; color: var(--text2); line-height: 1.5; }
  .detail-note {
    background: var(--bg3); border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 13px; color: var(--text2);
    line-height: 1.6; margin-top: 4px; white-space: pre-wrap;
  }

  .error-bar {
    background: var(--red-bg); border: 1px solid var(--red);
    border-radius: var(--radius-sm); padding: 10px 14px;
    font-size: 13px; color: var(--red); margin-bottom: 12px;
    display: none;
  }
</style>
</head>
<body>

<!-- 登入頁面 -->
<div id="login-page" style="display:none; position:fixed; inset:0; background:#111112; z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem;">
  <div style="text-align:center; max-width:320px; width:100%;">
    <div style="font-size:48px; margin-bottom:1rem;">🚒</div>
    <h1 style="font-size:22px; font-weight:700; margin-bottom:8px; color:#f5f5f5;">課程管理</h1>
    <p style="font-size:14px; color:#8e8e93; margin-bottom:2rem;">消防／EMTP教官課程行程管理系統</p>
    <div id="login-error" style="display:none; background:rgba(255,69,58,0.12); border:1px solid #ff453a; border-radius:10px; padding:10px 14px; font-size:13px; color:#ff453a; margin-bottom:1rem;"></div>
    <a href="/api/auth?action=login" style="display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:13px; background:#f5f5f5; color:#111112; border-radius:12px; font-size:15px; font-weight:500; text-decoration:none; transition:opacity .15s;">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      使用 Google 帳號登入

    <p style="font-size:12px; color:#48484a; margin-top:1.5rem;">僅限授權人員使用</p>
  </div>
</div>

<!-- 使用者資訊列 -->
<div id="user-bar" style="display:none; background:rgba(28,28,30,0.9); border-bottom:1px solid rgba(255,255,255,0.08); padding:8px 20px; display:flex; align-items:center; justify-content:space-between;">
  <div style="display:flex; align-items:center; gap:8px;">
    <img id="user-avatar" src="" style="width:28px; height:28px; border-radius:50%; display:none;">
    <span id="user-name" style="font-size:13px; color:#8e8e93;"></span>
  </div>
  <a href="/api/auth?action=logout" style="font-size:12px; color:#ff453a; text-decoration:none;">登出</a>
</div>

<div id="main-app" style="display:none;">
<div class="topbar">
  <div class="topbar-left">
    <h1>課程管理</h1>
    <p>0943ben · 消防／EMTP教官</p>
  </div>
  <button class="add-btn" onclick="openAdd()">＋</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('schedule')">行程</div>
  <div class="tab" onclick="switchTab('stats')">統計</div>
</div>

<div id="schedule" class="section active">
  <div class="loading" id="loading"><div class="spinner"></div>載入中...</div>
  <div id="course-list"></div>
</div>

<div id="stats" class="section">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">授課時數</div><div class="stat-val" id="s-hours">—</div><div class="stat-sub">小時</div></div>
    <div class="stat-card"><div class="stat-label">總課程數</div><div class="stat-val" id="s-total">—</div><div class="stat-sub">堂</div></div>
    <div class="stat-card"><div class="stat-label">授課場次</div><div class="stat-val" id="s-teach">—</div><div class="stat-sub">場</div></div>
    <div class="stat-card"><div class="stat-label">受/複訓</div><div class="stat-val" id="s-train">—</div><div class="stat-sub">場</div></div>
  </div>
  <div class="chart-label">各單位授課時數</div>
  <div id="unit-chart"></div>
  <div class="chart-label">課程類型分佈</div>
  <div id="type-chart"></div>
</div>



<!-- 新增/編輯 Sheet -->
<div class="overlay" id="form-overlay" onclick="closeOverlay(event,'form-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="form-title">新增課程</div>
    <div class="error-bar" id="form-error"></div>
    <input type="hidden" id="f-id">
    <div class="form-group">
      <label class="form-label">標籤（你的身份）</label>
      <select id="f-tag">
        <option value="授課">授課（教官）</option>
        <option value="複訓">複訓（學員複訓）</option>
        <option value="受訓">受訓（學員初訓）</option>
        <option value="行政">行政（會議/勤務）</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">單位</label>
        <select id="f-unit">
          <option value="一大">一大</option>
          <option value="TEMTA">TEMTA</option>
          <option value="國安局">國安局</option>
          <option value="中正中隊">中正中隊</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">課程類型</label>
        <select id="f-type">
          <option value="義消BLS">義消BLS</option>
          <option value="EMT-1">EMT-1</option>
          <option value="EMT-1+">EMT-1+</option>
          <option value="防災士">防災士</option>
          <option value="T-CERT">T-CERT</option>
          <option value="其他">其他</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" id="f-date">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">開始時間</label>
        <input type="time" id="f-start">
      </div>
      <div class="form-group">
        <label class="form-label">結束時間</label>
        <input type="time" id="f-end">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">地點</label>
      <input type="text" id="f-location" placeholder="如：一大禮堂">
    </div>
    <div class="form-group">
      <label class="form-label">授課時數</label>
      <input type="number" id="f-hours" placeholder="0.0" step="0.5" min="0">
    </div>
    <div class="form-group">
      <label class="form-label">備注／教材</label>
      <textarea id="f-note" placeholder="課程細節、教材、備注..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeSheet('form-overlay')">取消</button>
      <button class="btn btn-primary" onclick="saveCourse()">儲存</button>
    </div>
  </div>
</div>

<!-- 詳細資訊 Sheet -->
<div class="overlay" id="detail-overlay" onclick="closeOverlay(event,'detail-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="detail-content"></div>
  </div>
</div>

<script>
const API = '/api/notion';
let courses = [];

async function loadCourses() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('course-list').innerHTML = '';
  try {
    const r = await fetch(`${API}?action=list`);
    courses = await r.json();
    renderSchedule();
    renderStats();
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>載入失敗，請重試</div>';
  }
  document.getElementById('loading').style.display = 'none';
}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  const days = ['日','一','二','三','四','五','六'];
  return `${dt.getMonth()+1}/${dt.getDate()}（${days[dt.getDay()]}）`;
}

let showExpired = false;

function renderSchedule() {
  const list = document.getElementById('course-list');
  if (!courses.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📅</div>尚無課程行程</div>';
    return;
  }
  const now = new Date();
  const sorted = [...courses].sort((a,b) => a.date.localeCompare(b.date));
  const active = sorted.filter(c => new Date(c.date + 'T23:59:59') >= now);
  const expired = sorted.filter(c => new Date(c.date + 'T23:59:59') < now);

  let html = '';

  if (active.length) {
    const groups = {};
    active.forEach(c => {
      const ym = c.date.slice(0,7);
      if (!groups[ym]) groups[ym] = [];
      groups[ym].push(c);
    });
    html += Object.entries(groups).map(([ym, cs]) => {
      const [y,m] = ym.split('-');
      return `<div class="month-label">${y} 年 ${parseInt(m)} 月</div>` +
        cs.map(c => cardHTML(c, false)).join('');
    }).join('');
  } else {
    html += '<div class="empty" style="padding:24px 0"><div class="empty-icon">📅</div>目前沒有即將到來的行程</div>';
  }

  if (expired.length) {
    html += `
    <div style="margin-top:16px;">
      <button onclick="toggleExpired()" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;cursor:pointer;color:var(--text2);font-size:13px;font-family:'Noto Sans TC',sans-serif;">
        <span>⏰ 已過期行程（${expired.length} 筆）</span>
        <span id="expired-arrow" style="transition:transform .2s">${showExpired ? '▲' : '▼'}</span>
      </button>
      <div id="expired-list" style="display:${showExpired ? 'block' : 'none'};margin-top:8px;opacity:0.5;">
        ${expired.map(c => cardHTML(c, true)).join('')}
      </div>
    </div>`;
  }

  list.innerHTML = html;
}

function cardHTML(c, isExpired) {
  return `
  <div class="card tag-${c.tag}${isExpired ? ' expired' : ''}" onclick="openDetail('${c.id}')">
    <div class="card-title">[${c.tag}/${c.unit}] ${c.type}</div>
    <div class="card-meta">
      <span>📅 ${fmtDate(c.date)}</span>
      ${c.startTime ? `<span>🕐 ${c.startTime}&ndash;${c.endTime}</span>` : ''}
      ${c.location ? `<span>📍 ${c.location}</span>` : ''}
    </div>
    <span class="badge badge-${c.tag}">${c.tag}</span>
  </div>`;
}

function toggleExpired() {
  showExpired = !showExpired;
  document.getElementById('expired-list').style.display = showExpired ? 'block' : 'none';
  document.getElementById('expired-arrow').textContent = showExpired ? '▲' : '▼';
}

function renderStats() {
  const total = courses.length;
  const totalH = courses.reduce((s,c) => s + (c.hours||0), 0);
  const teach = courses.filter(c=>c.tag==='授課').length;
  const train = courses.filter(c=>c.tag==='複訓'||c.tag==='受訓').length;
  document.getElementById('s-hours').textContent = totalH.toFixed(1);
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-teach').textContent = teach;
  document.getElementById('s-train').textContent = train;

  const unitColors = { '一大':'#ff453a','TEMTA':'#0a84ff','國安局':'#32d74b','中正中隊':'#ffd60a','其他':'#636366' };
  const units = {};
  courses.filter(c=>c.tag==='授課').forEach(c => { units[c.unit] = (units[c.unit]||0) + (c.hours||0); });
  const maxU = Math.max(1,...Object.values(units));
  document.getElementById('unit-chart').innerHTML = Object.keys(units).length ?
    Object.entries(units).map(([u,h]) =>
      `<div class="bar-row"><div class="bar-name">${u}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(h/maxU*100)}%;background:${unitColors[u]||'#636366'}"><span>${h.toFixed(1)}h</span></div></div></div>`
    ).join('') : '<div style="color:var(--text3);font-size:13px">尚無授課紀錄</div>';

  const types = {};
  courses.forEach(c => { types[c.type] = (types[c.type]||0)+1; });
  const maxT = Math.max(1,...Object.values(types));
  document.getElementById('type-chart').innerHTML = Object.entries(types).map(([t,n]) =>
    `<div class="bar-row"><div class="bar-name" style="font-size:11px">${t}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/maxT*100)}%;background:#636366"><span>${n}</span></div></div></div>`
  ).join('');
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['schedule','stats'][i]===tab));
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===tab));
}

function openAdd() {
  document.getElementById('form-title').textContent = '新增課程';
  document.getElementById('f-id').value = '';
  document.getElementById('f-tag').value = '授課';
  document.getElementById('f-unit').value = '一大';
  document.getElementById('f-type').value = '義消BLS';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('f-start').value = '';
  document.getElementById('f-end').value = '';
  document.getElementById('f-location').value = '';
  document.getElementById('f-hours').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('form-overlay').classList.add('open');
}

function openDetail(id) {
  const c = courses.find(x=>x.id===id);
  if (!c) return;
  document.getElementById('detail-content').innerHTML = `
    <div class="sheet-title">[${c.tag}/${c.unit}] ${c.type}</div>
    <span class="badge badge-${c.tag}" style="margin-bottom:16px;display:inline-block">${c.tag}</span>
    ${c.date ? `<div class="detail-row"><div class="detail-icon">📅</div><div class="detail-text">${fmtDate(c.date)}</div></div>` : ''}
    ${c.startTime ? `<div class="detail-row"><div class="detail-icon">🕐</div><div class="detail-text">${c.startTime} – ${c.endTime}</div></div>` : ''}
    ${c.location ? `<div class="detail-row"><div class="detail-icon">📍</div><div class="detail-text">${c.location}</div></div>` : ''}
    ${c.hours ? `<div class="detail-row"><div class="detail-icon">⏱</div><div class="detail-text">${c.hours} 小時</div></div>` : ''}
    ${c.note ? `<div style="margin-top:8px"><div class="form-label">備注</div><div class="detail-note">${c.note}</div></div>` : ''}
    <div class="btn-row" style="margin-top:20px">
      <button class="btn btn-danger" onclick="deleteCourse('${c.id}')">刪除</button>
      <button class="btn btn-primary" onclick="openEdit('${c.id}')">編輯</button>
    </div>`;
  document.getElementById('detail-overlay').classList.add('open');
}

function openEdit(id) {
  const c = courses.find(x=>x.id===id);
  if (!c) return;
  document.getElementById('detail-overlay').classList.remove('open');
  document.getElementById('form-title').textContent = '編輯課程';
  document.getElementById('f-id').value = c.id;
  document.getElementById('f-tag').value = c.tag;
  document.getElementById('f-unit').value = c.unit;
  document.getElementById('f-type').value = c.type;
  document.getElementById('f-date').value = c.date;
  document.getElementById('f-start').value = c.startTime;
  document.getElementById('f-end').value = c.endTime;
  document.getElementById('f-location').value = c.location;
  document.getElementById('f-hours').value = c.hours;
  document.getElementById('f-note').value = c.note;
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('form-overlay').classList.add('open');
}

async function saveCourse() {
  const id = document.getElementById('f-id').value;
  const body = {
    tag: document.getElementById('f-tag').value,
    unit: document.getElementById('f-unit').value,
    type: document.getElementById('f-type').value,
    date: document.getElementById('f-date').value,
    startTime: document.getElementById('f-start').value,
    endTime: document.getElementById('f-end').value,
    location: document.getElementById('f-location').value,
    hours: document.getElementById('f-hours').value,
    note: document.getElementById('f-note').value,
  };
  if (!body.date) { showError('請選擇日期'); return; }
  try {
    const url = id ? `${API}?action=update&pageId=${id}` : `${API}?action=create`;
    const method = id ? 'PATCH' : 'POST';
    const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await r.json();
    if (data.error) { showError(data.error); return; }
    closeSheet('form-overlay');
    await loadCourses();
  } catch(e) { showError('儲存失敗，請重試'); }
}

async function deleteCourse(id) {
  if (!confirm('確定要刪除這個課程嗎？')) return;
  try {
    await fetch(`${API}?action=delete&pageId=${id}`, { method: 'DELETE' });
    closeSheet('detail-overlay');
    await loadCourses();
  } catch(e) { alert('刪除失敗，請重試'); }
}

function showError(msg) {
  const el = document.getElementById('form-error');
  el.textContent = msg; el.style.display = 'block';
}
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function closeOverlay(e, id) { if (e.target === document.getElementById(id)) closeSheet(id); }

// 登入驗證
async function checkAuth() {
  const urlParams = new URLSearchParams(window.location.search);
  const error = urlParams.get('error');
  try {
    const r = await fetch('/api/auth?action=me');
    if (r.ok) {
      const user = await r.json();
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('user-bar').style.display = 'flex';
      document.getElementById('user-name').textContent = user.email;
      if (user.picture) {
        const avatar = document.getElementById('user-avatar');
        avatar.src = user.picture;
        avatar.style.display = 'block';
      }
      loadCourses();
    } else { showLogin(error); }
  } catch { showLogin(error); }
}

function showLogin(error) {
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('user-bar').style.display = 'none';
  if (error) {
    const errEl = document.getElementById('login-error');
    const msgs = { unauthorized:'您的帳號沒有存取權限', auth_failed:'登入失敗，請再試一次', token_failed:'驗證失敗，請再試一次' };
    errEl.textContent = msgs[error] || '登入時發生錯誤';
    errEl.style.display = 'block';
  }
}


checkAuth();
