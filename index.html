<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f10">
<title>課程管理</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f10;--bg2:#1a1a1c;--bg3:#252528;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f0f0;--text2:#888;--text3:#444;
  --red:#ff4444;--orange:#ff8c00;--blue:#2d8cff;--green:#2dcc70;--amber:#ffc107;--purple:#9b59b6;
  --red-bg:rgba(255,68,68,0.12);--orange-bg:rgba(255,140,0,0.12);
  --blue-bg:rgba(45,140,255,0.12);--green-bg:rgba(45,204,112,0.12);
  --amber-bg:rgba(255,193,7,0.12);--purple-bg:rgba(155,89,182,0.12);
  --r:12px;--r-sm:8px;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:50;background:rgba(15,15,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-size:17px;font-weight:600;letter-spacing:-.3px}
.topbar-sub{font-size:11px;color:var(--text2);margin-top:2px;font-family:'DM Mono',monospace}
.add-btn{width:32px;height:32px;border-radius:50%;background:var(--text);color:var(--bg);border:none;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .15s;flex-shrink:0}
.add-btn:active{opacity:.7}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 18px;background:var(--bg);position:sticky;top:65px;z-index:40}
.tab{flex:1;padding:11px 0;font-size:12px;font-weight:400;color:var(--text2);cursor:pointer;text-align:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab.active{color:var(--text);font-weight:500;border-bottom-color:var(--text)}

.section{display:none;padding:14px 12px}
.section.active{display:block}

/* USER BAR */
.user-bar{background:rgba(26,26,28,0.9);border-bottom:1px solid var(--border);padding:8px 18px;display:flex;align-items:center;justify-content:space-between}
.user-info{display:flex;align-items:center;gap:8px}
.user-avatar{width:26px;height:26px;border-radius:50%}
.user-email{font-size:12px;color:var(--text2);font-family:'DM Mono',monospace}
.logout-btn{font-size:12px;color:var(--red);text-decoration:none}

/* CALENDAR */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-month{font-size:15px;font-weight:600;font-family:'DM Mono',monospace}
.cal-nav{width:32px;height:32px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;transition:border-color .15s}
.cal-nav:hover{border-color:var(--border2)}

/* FILTER */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);font-size:11px;cursor:pointer;color:var(--text2);background:var(--bg2);transition:all .15s;font-family:'Noto Sans TC',sans-serif}
.filter-btn.active{border-color:transparent;color:#fff}
.filter-btn.f-課程.active{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.filter-btn.f-生活.active{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.filter-btn.f-專案.active{background:var(--purple-bg);color:var(--purple);border-color:var(--purple)}
.filter-btn.f-其他.active{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
.filter-dot{width:7px;height:7px;border-radius:50%}

/* GRID */
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.cal-dow{background:var(--bg2);padding:9px 0;text-align:center;font-size:13px;color:var(--text3);font-family:'DM Mono',monospace;letter-spacing:.05em}
.cal-cell{background:var(--bg2);min-height:90px;padding:6px 5px;cursor:pointer;transition:background .12s;position:relative}
.cal-cell:hover{background:var(--bg3)}
.cal-cell.today .cal-day{background:var(--text);color:var(--bg);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:600}
.cal-cell.other-month .cal-day{color:var(--text3)}
.cal-day{font-size:15px;color:var(--text2);margin-bottom:4px;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.cal-events{display:flex;flex-direction:column;gap:3px}
.cal-event-bar{font-size:10px;border-radius:4px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;line-height:1.4;max-width:100%;box-sizing:border-box}
.cal-event-bar.span-start{border-radius:4px 0 0 4px}
.cal-event-bar.span-mid{border-radius:0;margin:0 -1px}
.cal-event-bar.span-end{border-radius:0 4px 4px 0}
.cal-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin:1px}

/* TAG COLORS */
.tag-授課-教官{background:var(--red-bg);color:var(--red)}
.tag-授課-助教{background:var(--orange-bg);color:var(--orange)}
.tag-訓練{background:var(--blue-bg);color:var(--blue)}
.tag-其他{background:var(--amber-bg);color:var(--amber)}
.cat-課程{background:var(--blue-bg);color:var(--blue)}
.cat-生活{background:var(--green-bg);color:var(--green)}
.cat-專案{background:var(--purple-bg);color:var(--purple)}
.cat-其他{background:var(--amber-bg);color:var(--amber)}

/* DAY DETAIL */
.day-detail{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:14px;display:none}
.day-detail.show{display:block}
.day-detail-title{font-size:13px;font-weight:500;margin-bottom:10px;color:var(--text2);font-family:'DM Mono',monospace}
.day-event-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
.day-event-item:last-child{border-bottom:none}
.day-event-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.day-event-info{flex:1}
.day-event-name{font-size:13px;font-weight:500}
.day-event-meta{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;margin-top:2px}

/* SCHEDULE */
.month-label{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;font-family:'DM Mono',monospace;margin:18px 0 8px;padding-left:2px}
.month-label:first-child{margin-top:4px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .12s;position:relative;overflow:hidden}
.card:active{transform:scale(.98)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.card.tag-授課-教官::before{background:var(--red)}
.card.tag-授課-助教::before{background:var(--orange)}
.card.tag-訓練::before{background:var(--blue)}
.card.tag-其他::before{background:var(--amber)}
.card.cat-生活::before{background:var(--green)}
.card.cat-專案::before{background:var(--purple)}
.card-title{font-size:13px;font-weight:500;margin-bottom:5px;padding-left:2px}
.card-meta{display:flex;flex-wrap:wrap;gap:6px}
.card-meta span{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:3px;font-family:'DM Mono',monospace}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;margin-top:6px}
.badge-授課-教官{background:var(--red-bg);color:var(--red)}
.badge-授課-助教{background:var(--orange-bg);color:var(--orange)}
.badge-訓練{background:var(--blue-bg);color:var(--blue)}
.badge-其他{background:var(--amber-bg);color:var(--amber)}
.badge-生活{background:var(--green-bg);color:var(--green)}
.badge-專案{background:var(--purple-bg);color:var(--purple)}
.expired-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;cursor:pointer;color:var(--text2);font-size:12px;font-family:'Noto Sans TC',sans-serif;margin-bottom:8px}

/* STATS */
.chart-label{font-size:10px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;font-family:'DM Mono',monospace;margin:16px 0 10px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-name{font-size:11px;color:var(--text2);width:72px;flex-shrink:0;font-family:'DM Mono',monospace}
.bar-track{flex:1;height:20px;background:var(--bg3);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;display:flex;align-items:center;padding-left:8px;min-width:28px}
.bar-fill span{font-size:10px;font-weight:500;color:rgba(255,255,255,.85);font-family:'DM Mono',monospace}

/* LOADING & EMPTY */
.loading{text-align:center;padding:40px 0;color:var(--text2);font-size:13px}
.spinner{width:22px;height:22px;border:2px solid var(--bg3);border-top-color:var(--text2);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 0;color:var(--text2);font-size:13px}
.empty-icon{font-size:32px;margin-bottom:10px;opacity:.4}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(26,26,28,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 20px;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--text3);font-size:10px;transition:color .15s;padding:4px 0}
.nav-item.active{color:var(--text)}
.nav-icon{font-size:20px}

/* OVERLAY & SHEET */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.sheet{background:var(--bg2);border-radius:18px 18px 0 0;padding:0 18px 40px;width:100%;max-height:92vh;overflow-y:auto;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--bg3);border-radius:2px;margin:12px auto 16px}
.sheet-title{font-size:16px;font-weight:600;margin-bottom:18px}

.form-group{margin-bottom:14px}
.form-label{font-size:11px;color:var(--text2);margin-bottom:5px;display:block;letter-spacing:.04em;font-family:'DM Mono',monospace}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input[type=text],input[type=date],input[type=time],textarea{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;font-family:'Noto Sans TC',sans-serif;appearance:none;outline:none;transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--border2)}
textarea{height:72px;resize:none}
.error-bar{background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r-sm);padding:9px 12px;font-size:12px;color:var(--red);margin-bottom:12px;display:none}
.btn-row{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:'Noto Sans TC',sans-serif;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-primary{background:var(--text);color:var(--bg)}
.btn-ghost{background:var(--bg3);color:var(--text2)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.combo-wrap{position:relative}
.combo-back{font-size:11px;color:var(--text2);cursor:pointer;margin-top:4px;display:none;text-align:right}

/* DETAIL */
.detail-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.detail-icon{font-size:15px;margin-top:1px;flex-shrink:0}
.detail-text{font-size:13px;color:var(--text2);line-height:1.5}
.detail-note{background:var(--bg3);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.6;margin-top:4px;white-space:pre-wrap}

/* LOGIN */
#login-page{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page" style="display:none">
  <div style="text-align:center;max-width:300px;width:100%">
    <div style="font-size:44px;margin-bottom:1rem">🚒</div>
    <h1 style="font-size:20px;font-weight:700;margin-bottom:6px">課程管理</h1>
    <p style="font-size:13px;color:var(--text2);margin-bottom:2rem">消防／EMTP教官課程行程管理</p>
    <div id="login-error" style="display:none;background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;color:var(--red);margin-bottom:1rem"></div>
    <a href="/api/auth?action=login" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;background:#f5f5f5;color:#111;border-radius:12px;font-size:14px;font-weight:500;text-decoration:none">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      使用 Google 帳號登入
    </a>
    <p style="font-size:11px;color:var(--text3);margin-top:1.5rem">僅限授權人員使用</p>
  </div>
</div>

<div id="main-app" style="display:none">

<!-- USER BAR -->
<div id="user-bar" class="user-bar" style="display:none">
  <div class="user-info">
    <img id="user-avatar" src="" class="user-avatar" style="display:none">
    <span id="user-name" class="user-email"></span>
  </div>
  <a href="/api/auth?action=logout" class="logout-btn">登出</a>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div>
    <div class="topbar-title">課程管理</div>
    <div class="topbar-sub" id="cal-month-label"></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="add-btn" style="width:auto;border-radius:16px;padding:0 12px;font-size:12px;font-weight:500;background:var(--bg2);color:var(--text2);border:1px solid var(--border)" onclick="openQuickInput()">✦ 快速輸入</button>
    <div style="display:flex;gap:8px">
    <button class="add-btn" style="background:var(--bg2);border:1px solid var(--border);color:var(--text2)" onclick="openQuickInput()" title="快速輸入">⚡</button>
    <button class="add-btn" onclick="openAdd()">＋</button>
  </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('calendar')">行事曆</div>
  <div class="tab" onclick="switchTab('schedule')">行程</div>
  <div class="tab" onclick="switchTab('projects')">專案</div>
  <div class="tab" onclick="switchTab('stats')">統計</div>
</div>

<!-- CALENDAR TAB -->
<div id="calendar" class="section active">
  <div class="loading" id="cal-loading"><div class="spinner"></div>載入中...</div>
  <div id="cal-content" style="display:none">
    <div class="cal-header">
      <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
      <div class="cal-month" id="cal-title"></div>
      <button class="cal-nav" onclick="changeMonth(1)">›</button>
    </div>
    <div class="filters" id="filters">
      <div class="filter-btn f-課程 active" onclick="toggleFilter('課程')"><div class="filter-dot" style="background:var(--blue)"></div>課程</div>
      <div class="filter-btn f-生活 active" onclick="toggleFilter('生活')"><div class="filter-dot" style="background:var(--green)"></div>生活</div>
      <div class="filter-btn f-專案 active" onclick="toggleFilter('專案')"><div class="filter-dot" style="background:var(--purple)"></div>專案</div>
      <div class="filter-btn f-其他 active" onclick="toggleFilter('其他')"><div class="filter-dot" style="background:var(--amber)"></div>其他</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="day-detail" id="day-detail">
      <div class="day-detail-title" id="day-detail-title"></div>
      <div id="day-detail-list"></div>
    </div>
  </div>
</div>

<!-- SCHEDULE TAB -->
<div id="schedule" class="section">
  <div class="loading" id="sch-loading" style="display:none"><div class="spinner"></div>載入中...</div>
  <div id="course-list"></div>
</div>

<!-- PROJECTS TAB -->
<div id="projects" class="section">
  <div id="project-list"></div>
  <div style="margin-top:12px">
    <button onclick="openAddProject()" style="width:100%;padding:12px;background:var(--purple-bg);color:var(--purple);border:1px dashed var(--purple);border-radius:var(--r);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;">＋ 新增專案</button>
  </div>
</div>

<!-- STATS TAB -->
<div id="stats" class="section">
  <div class="chart-label">依標籤分類</div>
  <div id="tag-chart"></div>
  <div class="chart-label">依課程類型分類</div>
  <div id="type-chart"></div>
  <div class="chart-label">依類別分類</div>
  <div id="cat-chart"></div>
</div>

</div><!-- main-app -->

<!-- 新增/編輯 Sheet -->
<div class="overlay" id="form-overlay" onclick="closeOverlay(event,'form-overlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="form-title">新增行程</div>
    <div class="error-bar" id="form-error"></div>
    <input type="hidden" id="f-id">

    <div class="form-group">
      <label class="form-label">類別</label>
      <select id="f-cat" onchange="toggleCourseFields()">
        <option value="課程">課程</option>
        <option value="生活">生活</option>
        <option value="專案">專案</option>
        <option value="其他">其他</option>
      </select>
    </div>

    <div id="course-fields">
      <div class="form-group">
        <label class="form-label">標籤（你的身份）</label>
        <div class="combo-wrap">
          <select id="f-tag-select" onchange="comboSelect('f-tag','f-tag-select');toggleUnitField()">
            <option value="授課-教官">授課-教官（主教官）</option>
            <option value="授課-助教">授課-助教（助教）</option>
            <option value="訓練">訓練（受訓/複訓）</option>
            <option value="其他">其他</option>
            <option value="__custom__">＋ 自訂...</option>
          </select>
          <input type="text" id="f-tag" style="display:none" placeholder="輸入自訂標籤">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" id="unit-group">
          <label class="form-label">單位</label>
          <div class="combo-wrap">
            <select id="f-unit-select" onchange="comboSelect('f-unit','f-unit-select')">
              <option value="TEMTA">TEMTA</option>
              <option value="公寓大廈">公寓大廈</option>
              <option value="一大">一大</option>
              <option value="後指部">後指部</option>
              <option value="EOC">EOC</option>
              <option value="__custom__">＋ 自訂...</option>
            </select>
            <input type="text" id="f-unit" style="display:none" placeholder="輸入自訂單位">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">課程類型</label>
          <div class="combo-wrap">
            <select id="f-type-select" onchange="comboSelect('f-type','f-type-select')">

<style>

<script>
const API = '/api/notion';
let courses = [];
let currentMonth = new Date();
let activeFilters = new Set(['課程','生活','專案','其他']);
let showExpired = false;
let selectedDate = null;

// ── AUTH ──
async function checkAuth() {
  const err = new URLSearchParams(location.search).get('error');
  try {
    const r = await fetch('/api/auth?action=me');
    if (r.ok) {
      const u = await r.json();
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('user-bar').style.display = 'flex';
      document.getElementById('user-name').textContent = u.email;
      if (u.picture) { const a=document.getElementById('user-avatar'); a.src=u.picture; a.style.display='block'; }
      await loadCourses();
    } else showLogin(err);
  } catch { showLogin(err); }
}
function showLogin(err) {
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('main-app').style.display = 'none';
  if (err) { const e=document.getElementById('login-error'); e.textContent={unauthorized:'您的帳號沒有存取權限',auth_failed:'登入失敗'}[err]||'登入時發生錯誤'; e.style.display='block'; }
}

// ── DATA ──
async function loadCourses() {
  try {
    const r = await fetch(`${API}?action=list`);
    courses = await r.json();
    renderCalendar();
    renderSchedule();
    renderStats();
    renderProjects();
    document.getElementById('cal-loading').style.display = 'none';
    document.getElementById('cal-content').style.display = 'block';
  } catch(e) {
    document.getElementById('cal-loading').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>載入失敗，請重試</div>';
  }
}

// ── CALENDAR ──
const CAT_COLOR = { '課程':'#2d8cff','生活':'#2dcc70','專案':'#9b59b6','其他':'#ffc107' };
const TAG_COLOR = { '授課-教官':'#ff4444','授課-助教':'#ff8c00','訓練':'#2d8cff','其他':'#ffc107' };

function getEventColor(c) {
  if (c.category && c.category !== '課程') return CAT_COLOR[c.category] || '#888';
  return TAG_COLOR[c.tag] || '#888';
}

function getEventClass(c) {
  if (c.category === '生活') return 'cat-生活';
  if (c.category === '專案') return 'cat-專案';
  if (!c.category || c.category === '課程') return `tag-${c.tag}`;
  return 'tag-其他';
}

function renderCalendar() {
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth();
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-title').textContent = `${y} / ${months[m]}`;
  document.getElementById('cal-month-label').textContent = `${y}年${months[m]}`;

  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const startDow = first.getDay();
  const today = new Date(); today.setHours(0,0,0,0);

  // 篩選課程
  const filtered = courses.filter(c => {
    const cat = c.category || '課程';
    return activeFilters.has(cat);
  });

  const grid = document.getElementById('cal-grid');
  // 3天一列，顯示當月所有天
  function getEventsForDay(date) {
    const ds = toDateStr(date);
    return filtered.filter(c => {
      const start = c.date;
      const end = c.endDate || c.date;
      return ds >= start && ds <= end;
    });
  }
  function toDateStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  const days3 = ['日','一','二'];
  let html = days3.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  // 計算第一天是星期幾（0=日,1=一,...,6=六）
  // 3天一列：每列3天，從月份第一天開始
  // 先補齊到第一週起始（週日為起始）
  // 找到月份第一天在3天grid中的起始位置
  // 我們直接從1號開始，不補空格，改用簡單的日期列表
  const totalDays = last.getDate();
  // 補齊到3的倍數
  const padEnd = (3 - (totalDays % 3)) % 3;

  for (let day = 1; day <= totalDays + padEnd; day++) {
    if (day > totalDays) {
      html += `<div class="cal-cell other-month"><div class="cal-day"></div></div>`;
      continue;
    }
    const date = new Date(y, m, day);
    const isToday = date.getTime() === today.getTime();
    const ds = toDateStr(date);
    const evs = getEventsForDay(date);
    const dow = ['日','一','二','三','四','五','六'][date.getDay()];

    let evHtml = '';
    evs.slice(0,2).forEach(c => {
      const color = getEventColor(c);
      const isStart = c.date === ds;
      const isEnd = (c.endDate || c.date) === ds;
      const isSpan = c.endDate && c.endDate !== c.date;
      let cls = isSpan ? (isStart ? 'span-start' : isEnd ? 'span-end' : 'span-mid') : '';
      // 標籤顯示：單位/課程類型 或 自訂標題
      let fullLabel = '';
      if (isStart) {
        if (c.category === '課程' && c.unit && c.type) fullLabel = `${c.unit}/${c.type}`;
        else if (c.category === '課程' && c.type) fullLabel = c.type;
        else fullLabel = c.title || c.tag || '';
      }
      const shortLabel = fullLabel.length > 8 ? fullLabel.slice(0,8)+'…' : fullLabel;
      evHtml += `<div class="cal-event-bar ${cls}" style="background:${color}22;color:${color};border-left:${isStart||!isSpan?`2px solid ${color}`:'none'}">${shortLabel}</div>`;
    });
    if (evs.length > 2) evHtml += `<div style="font-size:11px;color:var(--text3);padding-left:4px">+${evs.length-2}</div>`;

    // 檢查這天是否有專案截止日
    const projectsDue = courses.filter(c => c.category === '專案' && c.date === ds);
    const projDot = projectsDue.length ? `<div style="width:7px;height:7px;border-radius:50%;background:var(--purple);margin-left:auto;flex-shrink:0" title="${projectsDue.map(p=>p.title).join(', ')}"></div>` : '';

    html += `<div class="cal-cell${isToday?' today':''}" onclick="selectDay('${ds}')">
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">
        <div class="cal-day">${day}</div>
        <div style="font-size:11px;color:var(--text3)">${dow}</div>
        ${projDot}
      </div>
      <div class="cal-events">${evHtml}</div>
    </div>`;
  }
  grid.innerHTML = html;

  // 如果有選中日期，重新渲染詳情
  if (selectedDate) showDayDetail(selectedDate);
}

function selectDay(ds) {
  selectedDate = selectedDate === ds ? null : ds;
  if (selectedDate) showDayDetail(ds);
  else { document.getElementById('day-detail').classList.remove('show'); }
  renderCalendar();
}

function showDayDetail(ds) {
  const [y,m,d] = ds.split('-').map(Number);
  const days = ['日','一','二','三','四','五','六'];
  const dt = new Date(y,m-1,d);
  const evs = courses.filter(c => {
    const cat = c.category || '課程';
    if (!activeFilters.has(cat)) return false;
    const end = c.endDate || c.date;
    return ds >= c.date && ds <= end;
  });
  document.getElementById('day-detail-title').textContent = `${m}/${d}（${days[dt.getDay()]}）`;
  document.getElementById('day-detail-list').innerHTML = evs.length ?
    evs.map(c => `
      <div class="day-event-item" onclick="openDetail('${c.id}')">
        <div class="day-event-dot" style="background:${getEventColor(c)}"></div>
        <div class="day-event-info">
          <div class="day-event-name">${c.title || `[${c.tag||''}/${c.unit||''}] ${c.type||''}`}</div>
          ${c.startTime ? `<div class="day-event-meta">${c.startTime}–${c.endTime}</div>` : ''}
          ${c.location ? `<div class="day-event-meta">📍 ${c.location}</div>` : ''}
        </div>
      </div>`).join('') :
    '<div style="font-size:13px;color:var(--text2);padding:8px 0">這天沒有行程</div>';
  document.getElementById('day-detail').classList.add('show');
}

function changeMonth(dir) {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth()+dir, 1);
  selectedDate = null;
  document.getElementById('day-detail').classList.remove('show');
  renderCalendar();
}

function toggleFilter(cat) {
  if (activeFilters.has(cat)) activeFilters.delete(cat);
  else activeFilters.add(cat);
  document.querySelectorAll('.filter-btn').forEach(b => {
    const c = b.className.match(/f-(\S+)/)?.[1];
    if (c) b.classList.toggle('active', activeFilters.has(c));
  });
  renderCalendar();
  if (selectedDate) showDayDetail(selectedDate);
}

// ── SCHEDULE ──
function renderSchedule() {
  const list = document.getElementById('course-list');
  if (!courses.length) { list.innerHTML = '<div class="empty"><div class="empty-icon">📅</div>尚無行程</div>'; return; }
  const now = new Date(); now.setHours(0,0,0,0);
  const sorted = [...courses].sort((a,b)=>a.date.localeCompare(b.date));
  const active = sorted.filter(c => new Date(c.date+'T23:59:59') >= now);
  const expired = sorted.filter(c => new Date(c.date+'T23:59:59') < now);
  let html = '';
  if (expired.length) {
    html += `<button class="expired-toggle" onclick="toggleExpired()">
      <span>⏰ 已過期行程（${expired.length} 筆）</span>
      <span id="expired-arrow">${showExpired?'▲':'▼'}</span>
    </button>
    <div id="expired-list" style="display:${showExpired?'block':'none'};margin-bottom:8px;opacity:.45">
      ${[...expired].reverse().map(c=>cardHTML(c,true)).join('')}
    </div>`;
  }
  if (active.length) {
    const groups={};
    active.forEach(c=>{const ym=c.date.slice(0,7);if(!groups[ym])groups[ym]=[];groups[ym].push(c);});
    html+=Object.entries(groups).map(([ym,cs])=>{
      const[y,m]=ym.split('-');
      return`<div class="month-label">${y} 年 ${parseInt(m)} 月</div>`+cs.map(c=>cardHTML(c,false)).join('');
    }).join('');
  } else html+='<div class="empty" style="padding:24px 0"><div class="empty-icon">📅</div>目前沒有即將到來的行程</div>';
  list.innerHTML=html;
}

function fmtDate(d){if(!d)return'';const dt=new Date(d+'T00:00:00');const days=['日','一','二','三','四','五','六'];return`${dt.getMonth()+1}/${dt.getDate()}（${days[dt.getDay()]}）`}

function cardHTML(c, isExpired) {
  const cls = getEventClass(c);
  const title = c.title || `[${c.tag||''}/${c.unit||''}] ${c.type||''}`.replace('/]','').replace('[/','');
  const badgeCls = c.category==='生活'?'badge-生活':c.category==='專案'?'badge-專案':`badge-${c.tag||'其他'}`;
  const badgeLabel = c.category==='生活'?'生活':c.category==='專案'?'專案':(c.tag||'其他');

}

function renderStats(){
  const tagColors={'授課-教官':'#ff4444','授課-助教':'#ff8c00','訓練':'#2d8cff','其他':'#ffc107'};
  const catColors={'課程':'#2d8cff','生活':'#2dcc70','專案':'#9b59b6','其他':'#ffc107'};
  function makeChart(counts,colors,el){
    const max=Math.max(1,...Object.values(counts));
    document.getElementById(el).innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`
    <div class="bar-row"><div class="bar-name">${k}</div><div class="bar-track">
      <div class="bar-fill" style="width:${Math.round(n/max*100)}%;background:${colors[k]||'#636366'}"><span>${n} 場</span></div>
    </div></div>`).join('')||'<div style="color:var(--text3);font-size:12px">尚無資料</div>';
  }
  const tags={},types={},cats={};
  courses.forEach(c=>{
    if(c.tag) tags[c.tag]=(tags[c.tag]||0)+1;
    if(c.type) types[c.type]=(types[c.type]||0)+1;
    const cat=c.category||'課程'; cats[cat]=(cats[cat]||0)+1;
  });
  makeChart(tags,tagColors,'tag-chart');

}

function parseTextInfo(text, callback) {
  let date = '', startTime = '', endTime = '', location = '';
  const now = new Date();
  const y = now.getFullYear();

  // 解析日期
  const words = text.split(/\s+|，|,|
/);
  for (const w of words) {
    const m1 = w.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    const m2 = w.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
    if (m1) { date = m1[1]+'-'+m1[2].padStart(2,'0')+'-'+m1[3].padStart(2,'0'); break; }
    if (m2) { date = y+'-'+m2[1].padStart(2,'0')+'-'+m2[2].padStart(2,'0'); break; }
  }

  // 解析時間
  for (const w of words) {
    const tm = w.match(/^(\d{1,2}):(\d{2})[-~](\d{1,2}):(\d{2})$/);
    if (tm) {
      startTime = tm[1].padStart(2,'0')+':'+tm[2];
      endTime = tm[3].padStart(2,'0')+':'+tm[4];
      break;
    }
  }
  if (!startTime) {
    if (text.indexOf('下午') >= 0) { startTime='13:30'; endTime='16:30'; }
    else if (text.indexOf('上午') >= 0) { startTime='08:30'; endTime='12:00'; }
    else if (text.indexOf('整天') >= 0 || text.indexOf('全天') >= 0) { startTime='08:30'; endTime='16:30'; }
  }

  // 解析地點
  const locKw = ['教室','大隊','中心','學校','高中','大學','禮堂','辦公室','街','路'];
  for (const w of words) {
    if (locKw.some(k => w.indexOf(k) >= 0)) { location = w; break; }
  }

  callback(date, startTime, endTime, location);
}

function analyzeQuick() {

  if (text) {

    const dateMatch = text.match(/(\d{1,4})[\/\-](\d{1,2})(?:[\/\-](\d{1,2}))?/);
    if (dateMatch) {
      const now = new Date();
      const y = now.getFullYear();
      if (dateMatch[3]) {
        date = `${dateMatch[1].length===4?dateMatch[1]:y}-${dateMatch[2].padStart(2,'0')}-${dateMatch[3].padStart(2,'0')}`;
      } else {
        date = `${y}-${dateMatch[1].padStart(2,'0')}-${dateMatch[2].padStart(2,'0')}`;
      }
    }

    // 解析時間：HH:MM-HH:MM 或 HH:MM~HH:MM
    const timeMatch = text.match(/(\d{1,2})[:：](\d{2})\s*[-~～]\s*(\d{1,2})[:：](\d{2})/);
    if (timeMatch) {
      startTime = `${timeMatch[1].padStart(2,'0')}:${timeMatch[2]}`;
      endTime = `${timeMatch[3].padStart(2,'0')}:${timeMatch[4]}`;
    } else if (/下午|afternoon/i.test(text)) {
      startTime = '13:30'; endTime = '16:30';
    } else if (/上午|morning/i.test(text)) {
      startTime = '08:30'; endTime = '12:00';
    } else if (/整天|全天/i.test(text)) {
      startTime = '08:30'; endTime = '16:30';
    }

    // 解析地點：在 at、地點、@、教室、大隊 等關鍵字後面
    // 解析地點
    const locKeywords = ['教室','大隊','中心','學校','高中','大學','禮堂','辦公室'];
    const locMatch2 = text.split(/[\s,，]+/).find(w => locKeywords.some(k => w.includes(k)));

    if (date) document.getElementById('f-date').value = date;
    if (startTime) document.getElementById('f-start').value = startTime;
    if (endTime) document.getElementById('f-end').value = endTime;
    if (location) document.getElementById('f-location').value = location;

let miniCalMonth = new Date();
let selectedNodeDate = '';

function renderMiniCal(containerId, onSelect) {
  const y = miniCalMonth.getFullYear();
  const m = miniCalMonth.getMonth();
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const first = new Date(y,m,1);
  const last = new Date(y,m+1,0);
  const today = new Date(); today.setHours(0,0,0,0);

  let html = `<div class="mini-cal">
    <div class="mini-cal-header">
      <div class="mini-cal-nav" onclick="miniCalNav(-1,'${containerId}')">‹</div>
      <div class="mini-cal-title">${y}/${months[m]}</div>
      <div class="mini-cal-nav" onclick="miniCalNav(1,'${containerId}')">›</div>
    </div>
    <div class="mini-grid">`;
  ['日','一','二','三','四','五','六'].forEach(d=>{ html+=`<div class="mini-dow">${d}</div>`; });
  const startDow = first.getDay();
  for(let i=0;i<startDow;i++) html+=`<div class="mini-day other"></div>`;
  for(let d=1;d<=last.getDate();d++){
    const date=new Date(y,m,d);
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=date.getTime()===today.getTime();
    const isSel=ds===selectedNodeDate;
    html+=`<div class="mini-day${isToday?' today':''}${isSel?' selected':''}" onclick="selectNodeDate('${ds}','${containerId}')">${d}</div>`;
  }
  html+=`</div></div>`;
  document.getElementById(containerId).innerHTML=html;
}

function miniCalNav(dir, containerId) {
  miniCalMonth = new Date(miniCalMonth.getFullYear(), miniCalMonth.getMonth()+dir, 1);
  renderMiniCal(containerId);
}

function selectNodeDate(ds, containerId) {
  selectedNodeDate = ds;
  document.getElementById('node-date').value = ds;
  const [y,m,d] = ds.split('-').map(Number);
  const days=['日','一','二','三','四','五','六'];
  const dt = new Date(y,m-1,d);
  document.getElementById('node-date-display').textContent = `已選：${m}/${d}（${days[dt.getDay()]}）`;
  renderMiniCal(containerId);
}

  try {
    const r = await fetch(`/api/nodes?action=list&projectId=${projectId}`);
    const nodes = await r.json();
    projectNodes[projectId] = nodes;
    return nodes;
  } catch { return []; }
}

async function toggleNode(nodeId, currentDone, projectId) {
  await fetch(`/api/nodes?action=update&pageId=${nodeId}`, {
    method: 'PATCH', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ done: !currentDone })
  });
  projectNodes[projectId] = null;
  openProjectDetail(projectId);
}

async function deleteNode(nodeId, projectId) {
  if (!confirm('確定刪除這個節點？')) return;
  await fetch(`/api/nodes?action=delete&pageId=${nodeId}`, { method: 'DELETE' });
  projectNodes[projectId] = null;
  openProjectDetail(projectId);
}

async function openProjectDetail(projectId) {
  const p = courses.find(c => c.id === projectId);
  if (!p) return;

  document.getElementById('project-detail-content').innerHTML =
    `<div class="sheet-title">${p.title || '未命名專案'}</div><div class="loading"><div class="spinner"></div>載入節點...</div>`;
  document.getElementById('project-detail-overlay').classList.add('open');

  const nodes = projectNodes[projectId] || await loadNodes(projectId);
  const done = nodes.filter(n=>n.done).length;
  const pct = nodes.length ? Math.round(done/nodes.length*100) : 0;

  const now = new Date(); now.setHours(0,0,0,0);
  const due = p.date ? new Date(p.date+'T00:00:00') : null;
  const diffDays = due ? Math.ceil((due-now)/(1000*60*60*24)) : null;
  const statusText = diffDays === null ? '' : diffDays < 0 ? `已逾期 ${Math.abs(diffDays)} 天` : diffDays === 0 ? '今天截止' : `還有 ${diffDays} 天`;
  const statusColor = diffDays === null ? 'var(--purple)' : diffDays <= 0 ? 'var(--red)' : diffDays <= 7 ? 'var(--orange)' : 'var(--purple)';

  document.getElementById('project-detail-content').innerHTML = `
    <div class="sheet-title">${p.title || '未命名專案'}</div>
    ${p.note ? `<div style="font-size:13px;color:var(--text2);margin-bottom:12px">${p.note}</div>` : ''}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:12px;color:var(--text2)">${done}/${nodes.length} 完成</div>
      ${diffDays!==null?`<div style="font-size:12px;color:${statusColor};font-weight:500">${statusText}</div>`:''}
    </div>
    <div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:16px">
      <div style="height:100%;background:${statusColor};width:${pct}%;border-radius:3px;transition:width .3s"></div>
    </div>
    <div id="node-list">
      ${nodes.length ? nodes.map(n => {
        const nDue = n.date ? new Date(n.date+'T00:00:00') : null;
        const nDiff = nDue ? Math.ceil((nDue-now)/(1000*60*60*24)) : null;
        const nColor = n.done ? 'var(--green)' : nDiff !== null && nDiff < 0 ? 'var(--red)' : nDiff !== null && nDiff <= 3 ? 'var(--orange)' : 'var(--text2)';
        return `<div class="node-item">
          <div class="node-check${n.done?' done':''}" onclick="toggleNode('${n.id}',${n.done},'${projectId}')">
            ${n.done ? '✓' : ''}
          </div>
          <div class="node-info">
            <div class="node-name${n.done?' done':''}">${n.name}</div>
            ${n.date ? `<div class="node-date" style="color:${nColor}">${fmtDate(n.date)}${nDiff!==null&&!n.done?` · ${nDiff<0?'已逾期':nDiff===0?'今天':'還有'+nDiff+'天'}`:''}${n.done?' · 已完成':''}</div>` : ''}
          </div>
          <div style="font-size:18px;color:var(--text3);cursor:pointer" onclick="deleteNode('${n.id}','${projectId}')">×</div>
        </div>`;
      }).join('') : '<div style="color:var(--text2);font-size:13px;padding:12px 0">尚無節點，新增第一個里程碑！</div>'}
    </div>
    <button onclick="openAddNode('${projectId}')" style="width:100%;margin-top:14px;padding:11px;background:var(--purple-bg);color:var(--purple);border:1px dashed var(--purple);border-radius:var(--r);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif">＋ 新增節點</button>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-danger" onclick="deleteCourse('${p.id}');closeSheet('project-detail-overlay')">刪除專案</button>
      <button class="btn btn-ghost" onclick="closeSheet('project-detail-overlay')">關閉</button>
    </div>`;
}

function openAddNode(projectId) {
  selectedNodeDate = '';
  miniCalMonth = new Date();
  document.getElementById('node-project-id').value = projectId;
  document.getElementById('node-name').value = '';
  document.getElementById('node-date').value = '';
  document.getElementById('node-date-display').textContent = '';
  document.getElementById('node-note').value = '';
  document.getElementById('node-overlay').classList.add('open');
  renderMiniCal('node-cal-wrap');
}

async function saveNode() {
  const name = document.getElementById('node-name').value.trim();
  const date = document.getElementById('node-date').value;
  const note = document.getElementById('node-note').value.trim();
  const projectId = document.getElementById('node-project-id').value;
  if (!name) { alert('請輸入節點名稱'); return; }
  await fetch('/api/nodes?action=create', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, date, note, projectId })
  });
  projectNodes[projectId] = null;
  closeSheet('node-overlay');
  openProjectDetail(projectId);
}

function renderProjects() {
  const list = document.getElementById('project-list');
  const projects = courses.filter(c => c.category === '專案').sort((a,b) => a.date.localeCompare(b.date));
  if (!projects.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>尚無專案</div>';
    return;
  }
  const now = new Date(); now.setHours(0,0,0,0);
  list.innerHTML = projects.map(p => {
    const due = new Date(p.date + 'T00:00:00');
    const diffDays = Math.ceil((due - now) / (1000*60*60*24));
    const isOverdue = diffDays < 0;
    const isDueSoon = diffDays >= 0 && diffDays <= 7;
    let statusColor = 'var(--purple)';
    let statusText = `還有 ${diffDays} 天`;
    if (isOverdue) { statusColor = 'var(--red)'; statusText = `已逾期 ${Math.abs(diffDays)} 天`; }
    else if (diffDays === 0) { statusColor = 'var(--orange)'; statusText = '今天截止'; }
    else if (isDueSoon) { statusColor = 'var(--orange)'; }
    return `
    <div class="card cat-專案" onclick="openProjectDetail('${p.id}')" style="margin-bottom:10px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
        <div style="flex:1">
          <div class="card-title">${p.title || '未命名專案'}</div>
          ${p.note ? `<div style="font-size:12px;color:var(--text2);margin-top:4px">${p.note}</div>` : ''}
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:11px;color:${statusColor};font-weight:500;font-family:'DM Mono',monospace">${statusText}</div>
          <div style="font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;margin-top:2px">${fmtDate(p.date)}</div>
        </div>
      </div>
      <div style="margin-top:10px;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden">
        <div style="height:100%;background:${statusColor};width:${isOverdue?100:Math.max(5,100-diffDays*2)}%;border-radius:2px;transition:width .3s"></div>
      </div>
    </div>`;
  }).join('');
}

function openAddProject() {
  document.getElementById('form-title').textContent = '新增專案';
  document.getElementById('f-id').value = '';
  document.getElementById('f-cat').value = '專案';
  toggleCourseFields();
  document.getElementById('f-date').value = '';
  document.getElementById('f-end-date').value = '';
  document.getElementById('f-start').value = '';
  document.getElementById('f-end').value = '';
  document.getElementById('f-location').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('form-overlay').classList.add('open');
}

checkAuth();
</script>
</body>
</html>
